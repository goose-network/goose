name: OpenAPI

# On every push to main: regenerate internal/api/docs/swagger.json from the
# swag annotations in internal/api/api.go, verify it matches what is
# committed (so the spec never drifts), then generate the TypeScript SDK from
# this commit's spec and push it straight to goose-network/goose-sdk-ts.
# PRs only run the freshness check, and only when API-relevant files change.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "internal/api/**"
      - ".github/workflows/openapi.yml"
      - "Makefile"
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.ref }}
  # Superseded PR checks are cancelled; pushes to main are serialized so an
  # older run cannot push an older SDK after a newer one has landed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The go.mod replace directives point at sibling checkouts that do
      # not exist on CI. Re-point them at the published GitHub repos, pinned
      # to pseudo-versions, so the build resolves over the network.
      - name: Re-point local replace directives at published repos
        run: |
          go mod edit \
            -replace=github.com/goose-network/goose-plugin-api=github.com/goose-network/goose-plugin-api@v0.0.0-20260923221657-7ba364a3ef3c \
            -replace=github.com/goose-network/goose-plugin-psiphon=github.com/goose-network/psiphon@v0.0.0-20260924055847-0cb94efc10fd \
            -replace=github.com/goose-network/goose-plugin-mihomo=github.com/goose-network/goose-plugin-mihomo@v0.0.0-20261004175635-b916aa8de2de \
            -replace=github.com/goose-network/goose-plugin-singbox=github.com/goose-network/goose-plugin-singbox@v0.0.0-20261004175644-403bc49594ea \
            -replace=github.com/metacubex/mihomo=github.com/metacubex/mihomo@v0.0.0-20260922124647-afe94dafef8c \
            -replace=github.com/sagernet/sing-box=github.com/sagernet/sing-box@v0.0.0-20260922113237-e5e705ed802d \
            -replace=github.com/Psiphon-Labs/psiphon-tunnel-core=github.com/goose-network/psiphon-tunnel-core@v0.0.0-20260923221754-213987d32b71

      - name: Resolve pinned modules
        run: go mod tidy

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Regenerate OpenAPI spec
        run: make openapi

      - name: Check spec is up to date
        run: |
          if ! git diff --exit-code -- internal/api/docs/swagger.json; then
            echo "::error::internal/api/docs/swagger.json is stale. Run 'make openapi' and commit the result."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./internal/api/...

  push-sdk:
    # Generate the TS SDK from this commit's spec and push the result to
    # the main branch of goose-network/goose-sdk-ts. Cross-repo push needs
    # a PAT (the workflow's own GITHUB_TOKEN cannot write another repo);
    # GH_TOKEN is the org-level secret.
    needs: generate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out goose-sdk-ts
        uses: actions/checkout@v4
        with:
          repository: goose-network/goose-sdk-ts
          token: ${{ secrets.GH_TOKEN }}
          # Carry the caller's identity into the SDK commits.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate SDK from this commit's spec
        env:
          # Pin the ref so the SDK records exactly which goose commit it
          # was generated from, not whatever lands on main meanwhile.
          GOOSE_SPEC_REF: ${{ github.sha }}
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Push regenerated SDK to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "goose-openapi-bot"
          git config user.email "noreply@goose-network.github.io"
          if git diff --quiet; then
            echo "SDK already up to date with $GOOSE_SPEC_REF; nothing to push."
            exit 0
          fi
          git add -A
          git commit -m "Regenerate SDK from goose OpenAPI spec $GOOSE_SPEC_REF"
          git push origin main
          echo "Pushed regenerated SDK to goose-sdk-ts@main."
